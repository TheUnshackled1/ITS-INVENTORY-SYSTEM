<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%" style="background-color: #0b0f19; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Connectors -->
  <path d="M 400 85 L 150 125" stroke="#34d399" stroke-width="2" fill="none"/>
  <path d="M 400 85 L 400 125" stroke="#34d399" stroke-width="2" fill="none"/>
  <path d="M 400 85 L 650 125" stroke="#34d399" stroke-width="2" fill="none"/>

  <!-- Root Header -->
  <rect x="150" y="30" width="500" height="55" rx="12" fill="#065f46" stroke="#34d399" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="55" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">📄 CITATION.cff Academic Software Metadata (CFF 1.2.0)</text>
  <text x="400" y="73" fill="#a7f3d0" font-size="11" text-anchor="middle">GitHub Automatic APA &amp; BibTeX Citation Generator</text>

  <!-- Cards -->
  <rect x="40" y="125" width="220" height="65" rx="10" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="150" y="150" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">👤 Author Attribution</text>
  <text x="150" y="167" fill="#bae6fd" font-size="10" text-anchor="middle">John Tyrone Pagunsan Coronel</text>
  <text x="150" y="180" fill="#bae6fd" font-size="10" text-anchor="middle">Alias: TheUnshackled1</text>

  <rect x="290" y="125" width="220" height="65" rx="10" fill="#092E20" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="150" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">📦 Software Release</text>
  <text x="400" y="167" fill="#a7f3d0" font-size="10" text-anchor="middle">ITS Inventory System v1.0.0</text>
  <text x="400" y="180" fill="#a7f3d0" font-size="10" text-anchor="middle">Released: 2026-07-27</text>

  <rect x="540" y="125" width="220" height="65" rx="10" fill="#581c87" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="650" y="150" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">🏷️ Metadata &amp; License</text>
  <text x="650" y="167" fill="#ddd6fe" font-size="10" text-anchor="middle">Django, Audit Log, OTP Auth</text>
  <text x="650" y="180" fill="#ddd6fe" font-size="10" text-anchor="middle">License: MIT</text>
