<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 550" width="100%" height="100%" style="background-color: #0b0f19; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fde047"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c084fc"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <!-- Connectors -->
  <path d="M 260 75 L 320 75" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-blue)" fill="none"/>
  <text x="265" y="65" fill="#38bdf8" font-size="11" font-weight="600">POST /api/send-otp/</text>

  <path d="M 540 75 L 590 75" stroke="#fde047" stroke-width="2.5" marker-end="url(#arrow-yellow)" fill="none"/>
  <text x="545" y="65" fill="#fde047" font-size="11" font-weight="600">Session Save</text>

  <path d="M 700 110 L 700 190" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrow-purple)" fill="none"/>
  <text x="710" y="155" fill="#c084fc" font-size="11" font-weight="600">Dispatch Mail</text>

  <path d="M 590 225 L 540 225" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-blue)" fill="none"/>
  <text x="545" y="215" fill="#38bdf8" font-size="11" font-weight="600">Receive Code</text>

  <path d="M 430 260 L 430 310" stroke="#94a3b8" stroke-width="2.5" fill="none"/>
  <text x="440" y="290" fill="#94a3b8" font-size="11" font-weight="600">Verify</text>

  <path d="M 345 355 L 240 355 L 240 440" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-green)" fill="none"/>
  <text x="260" y="345" fill="#34d399" font-size="13" font-weight="bold">YES (Valid &lt;120s)</text>

  <path d="M 515 355 L 620 355 L 620 440" stroke="#f43f5e" stroke-width="2.5" marker-end="url(#arrow-red)" fill="none"/>
  <text x="535" y="345" fill="#f43f5e" font-size="13" font-weight="bold">NO (Invalid / Expired)</text>

  <!-- Nodes -->
  <rect x="40" y="40" width="220" height="70" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="70" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">🌐 Unauthenticated Client</text>
  <text x="150" y="90" fill="#cbd5e1" font-size="11" text-anchor="middle">Signup / Recovery Form</text>

  <rect x="320" y="40" width="220" height="70" rx="12" fill="#092E20" stroke="#34d399" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="70" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">⚙️ Generate 6-Digit OTP</text>
  <text x="430" y="90" fill="#a7f3d0" font-size="11" text-anchor="middle">Validate Email &amp; User</text>

  <rect x="590" y="40" width="220" height="70" rx="12" fill="#854d0e" stroke="#fde047" stroke-width="2" filter="url(#shadow)"/>
  <text x="700" y="70" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">⏱️ Django Session Store</text>
  <text x="700" y="90" fill="#fde047" font-size="11" text-anchor="middle">Code &amp; Expiry (120s Lifespan)</text>

  <rect x="590" y="190" width="220" height="70" rx="12" fill="#581c87" stroke="#c084fc" stroke-width="2" filter="url(#shadow)"/>
  <text x="700" y="220" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">📧 SMTP Email Delivery</text>
  <text x="700" y="240" fill="#ddd6fe" font-size="11" text-anchor="middle">Send Code to User Inbox</text>

  <rect x="320" y="190" width="220" height="70" rx="12" fill="#0369a1" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="220" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">🔑 User Submits OTP</text>
  <text x="430" y="240" fill="#bae6fd" font-size="11" text-anchor="middle">POST /api/verify-otp/</text>

  <!-- Rhombus Decision -->
  <polygon points="430,310 515,355 430,400 345,355" fill="#1e293b" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="350" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Matches Code &amp;</text>
  <text x="430" y="366" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">&lt; 120s Expiry?</text>

  <!-- Valid Box -->
  <rect x="120" y="440" width="240" height="70" rx="12" fill="#065f46" stroke="#34d399" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="470" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">✅ [ VALID ]</text>
  <text x="240" y="490" fill="#a7f3d0" font-size="11" text-anchor="middle">Create User Account / Log Session</text>

  <!-- Invalid Box -->
  <rect x="500" y="440" width="240" height="70" rx="12" fill="#9f1239" stroke="#f43f5e" stroke-width="2" filter="url(#shadow)"/>
  <text x="620" y="470" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">❌ [ INVALID / EXPIRED ]</text>
  <text x="620" y="490" fill="#fecdd3" font-size="11" text-anchor="middle">Return 400 Bad Request JSON</text>
</svg>