<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" style="background-color: #0b0f19; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c084fc"/>
    </marker>
  </defs>

  <!-- Connectors -->
  <path d="M 320 110 L 320 190" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-blue)" fill="none"/>
  <text x="210" y="155" fill="#38bdf8" font-size="12" font-weight="600">HTTP / AJAX Request</text>

  <path d="M 480 190 L 480 110" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-green)" fill="none"/>
  <text x="490" y="155" fill="#34d399" font-size="12" font-weight="600">JSON / Rendered HTML</text>

  <path d="M 300 260 L 300 340" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-blue)" fill="none"/>
  <text x="180" y="305" fill="#38bdf8" font-size="12" font-weight="600">ORM Operations</text>

  <path d="M 500 260 L 500 340" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrow-purple)" fill="none"/>
  <text x="510" y="305" fill="#c084fc" font-size="12" font-weight="600">SMTP Mail Engine</text>

  <!-- Browser Client Box -->
  <rect x="200" y="40" width="400" height="70" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="70" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">🌐 Browser / Frontend Client</text>
  <text x="400" y="92" fill="#94a3b8" font-size="12" text-anchor="middle">Tailwind CSS • SimpleDatatables • AJAX JavaScript</text>

  <!-- Django View Layer Box -->
  <rect x="200" y="190" width="400" height="70" rx="12" fill="#092E20" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="220" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">⚙️ Django View Layer</text>
  <text x="400" y="242" fill="#a7f3d0" font-size="12" text-anchor="middle">inventory/views.py &amp; Authentication APIs</text>

  <!-- Database Box -->
  <rect x="140" y="340" width="220" height="90" rx="12" fill="#003B57" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
  <text x="250" y="375" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">🗄️ Relational Database</text>
  <text x="250" y="395" fill="#bae6fd" font-size="12" text-anchor="middle">SQLite3 / PostgreSQL</text>
  <text x="250" y="412" fill="#7dd3fc" font-size="11" text-anchor="middle">3 Relational Schema Tables</text>

  <!-- SMTP Mail Box -->
  <rect x="440" y="340" width="220" height="90" rx="12" fill="#581c87" stroke="#c084fc" stroke-width="2" filter="url(#shadow)"/>
  <text x="550" y="375" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">📧 SMTP Mail Engine</text>
  <text x="550" y="395" fill="#ddd6fe" font-size="12" text-anchor="middle">Django Core Mail</text>
  <text x="550" y="412" fill="#c084fc" font-size="11" text-anchor="middle">6-Digit OTP Delivery</text>
</svg>