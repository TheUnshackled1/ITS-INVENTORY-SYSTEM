<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 200" width="100%" height="100%" style="background-color: #0b0f19; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fde047"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c084fc"/>
    </marker>
  </defs>

  <!-- Connectors -->
  <path d="M 170 100 L 200 100" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-blue)" fill="none"/>
  <path d="M 360 100 L 390 100" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-green)" fill="none"/>
  <path d="M 560 100 L 590 100" stroke="#fde047" stroke-width="2.5" marker-end="url(#arrow-yellow)" fill="none"/>
  <path d="M 740 100 L 770 100" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrow-purple)" fill="none"/>

  <!-- Step Cards -->
  <rect x="20" y="60" width="150" height="80" rx="10" fill="#0369a1" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
  <text x="95" y="90" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">1. Incident Report</text>
  <text x="95" y="112" fill="#bae6fd" font-size="10" text-anchor="middle">Private email to MIS</text>

  <rect x="200" y="60" width="160" height="80" rx="10" fill="#092E20" stroke="#34d399" stroke-width="2" filter="url(#shadow)"/>
  <text x="280" y="90" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">2. Investigation</text>
  <text x="280" y="112" fill="#a7f3d0" font-size="10" text-anchor="middle">Fair &amp; private triage</text>

  <rect x="390" y="60" width="170" height="80" rx="10" fill="#854d0e" stroke="#fde047" stroke-width="2" filter="url(#shadow)"/>
  <text x="475" y="90" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">3. Warning / Correction</text>
  <text x="475" y="112" fill="#fde047" font-size="10" text-anchor="middle">Written warning notice</text>

  <rect x="590" y="60" width="150" height="80" rx="10" fill="#581c87" stroke="#c084fc" stroke-width="2" filter="url(#shadow)"/>
  <text x="665" y="90" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">4. Temporary Ban</text>
  <text x="665" y="112" fill="#ddd6fe" font-size="10" text-anchor="middle">Time-limited access ban</text>

  <rect x="770" y="60" width="140" height="80" rx="10" fill="#9f1239" stroke="#f43f5e" stroke-width="2" filter="url(#shadow)"/>
  <text x="840" y="90" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">5. Permanent Ban</text>
  <text x="840" y="112" fill="#fecdd3" font-size="10" text-anchor="middle">Egregious violation ban</text>
</svg>