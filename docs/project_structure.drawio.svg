<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="100%" style="background-color: #0b0f19; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Connectors -->
  <path d="M 460 85 L 115 140" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <path d="M 460 85 L 285 140" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <path d="M 460 85 L 455 140" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <path d="M 460 85 L 625 140" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <path d="M 460 85 L 795 140" stroke="#38bdf8" stroke-width="2" fill="none"/>

  <!-- Root Repository Box -->
  <rect x="260" y="25" width="400" height="60" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
  <text x="460" y="52" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">📦 system/ (Root Repository)</text>
  <text x="460" y="72" fill="#bae6fd" font-size="12" text-anchor="middle">ITS Inventory Management System</text>

  <!-- Level 1 Category Nodes -->
  <rect x="40" y="140" width="150" height="55" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="115" y="165" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">📂 .github/</text>
  <text x="115" y="182" fill="#cbd5e1" font-size="10" text-anchor="middle">PR &amp; Issue Templates</text>

  <rect x="210" y="140" width="150" height="55" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="285" y="165" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">📂 docs/</text>
  <text x="285" y="182" fill="#cbd5e1" font-size="10" text-anchor="middle">Draw.io &amp; Assets</text>

  <rect x="380" y="140" width="150" height="55" rx="10" fill="#092E20" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="455" y="165" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">📂 its_inventory/</text>
  <text x="455" y="182" fill="#a7f3d0" font-size="10" text-anchor="middle">Project Settings &amp; URLs</text>

  <rect x="550" y="140" width="150" height="55" rx="10" fill="#003B57" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="625" y="165" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">📂 inventory/</text>
  <text x="625" y="182" fill="#bae6fd" font-size="10" text-anchor="middle">Models, Views &amp; Tests</text>

  <rect x="720" y="140" width="150" height="55" rx="10" fill="#581c87" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="795" y="165" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">📂 templates &amp; static/</text>
  <text x="795" y="182" fill="#ddd6fe" font-size="10" text-anchor="middle">HTML, CSS &amp; JS Assets</text>

  <!-- Level 2 Feature Cards -->
  <rect x="40" y="235" width="340" height="115" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="1" filter="url(#shadow)"/>
  <text x="55" y="260" fill="#ffffff" font-size="13" font-weight="bold">📄 Complete Documentation Suite</text>
  <text x="55" y="280" fill="#e2e8f0" font-size="10">• README.md, INSTRUCTIONS.md &amp; ARCHITECTURE.md</text>
  <text x="55" y="296" fill="#e2e8f0" font-size="10">• DEPLOYMENT.md, TESTING.md &amp; ROADMAP.md</text>
  <text x="55" y="312" fill="#e2e8f0" font-size="10">• CHANGELOG.md, SUPPORT.md &amp; CONTRIBUTING.md</text>
  <text x="55" y="328" fill="#e2e8f0" font-size="10">• CODE_OF_CONDUCT.md, SECURITY.md, CITATION.cff &amp; LICENSE</text>

  <rect x="400" y="235" width="240" height="115" rx="10" fill="#003B57" stroke="#38bdf8" stroke-width="1" filter="url(#shadow)"/>
  <text x="415" y="260" fill="#ffffff" font-size="13" font-weight="bold">⚙️ Core Application Logic</text>
  <text x="415" y="280" fill="#bae6fd" font-size="10">• models.py (Inventory, Issuance, Audit)</text>
  <text x="415" y="296" fill="#bae6fd" font-size="10">• views.py (CRUD, Borrowing, OTP APIs)</text>
  <text x="415" y="312" fill="#bae6fd" font-size="10">• forms.py &amp; admin.py</text>
  <text x="415" y="328" fill="#bae6fd" font-size="10">• tests.py (6/6 Automated Unit Test Suite)</text>

  <rect x="660" y="235" width="230" height="115" rx="10" fill="#581c87" stroke="#c084fc" stroke-width="1" filter="url(#shadow)"/>
  <text x="675" y="260" fill="#ffffff" font-size="13" font-weight="bold">🎨 User Interface Layer</text>
  <text x="675" y="280" fill="#ddd6fe" font-size="10">• dashboard.html &amp; inventory.html</text>
  <text x="675" y="296" fill="#ddd6fe" font-size="10">• borrowing.html &amp; activity_log.html</text>
  <text x="675" y="312" fill="#ddd6fe" font-size="10">• login.html (Dual-Panel Sliding Portal)</text>
  <text x="675" y="328" fill="#ddd6fe" font-size="10">• inventory.css, login.css &amp; JS scripts</text>
</svg>