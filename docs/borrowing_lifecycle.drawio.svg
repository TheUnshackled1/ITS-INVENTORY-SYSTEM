<svg xmlns="http://www.w3.org/2000/svg" width="860" height="280" viewBox="0 0 860 280" style="background:#0f172a; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4ade80"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f87171"/>
    </marker>
  </defs>

  <!-- Connectors -->
  <path d="M 180 140 L 260 140" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow-blue)" fill="none"/>

  <path d="M 400 120 L 490 70" stroke="#4ade80" stroke-width="2.5" marker-end="url(#arrow-green)" fill="none"/>
  <text x="430" y="85" fill="#86efac" font-size="11" font-weight="600" text-anchor="middle">Returned on time</text>

  <path d="M 400 160 L 490 210" stroke="#f87171" stroke-width="2.5" marker-end="url(#arrow-red)" fill="none"/>
  <text x="430" y="200" fill="#fca5a5" font-size="11" font-weight="600" text-anchor="middle">Past due date</text>

  <path d="M 650 210 L 710 210" stroke="#4ade80" stroke-width="2.5" marker-end="url(#arrow-green)" fill="none"/>
  <text x="680" y="198" fill="#86efac" font-size="11" font-weight="600" text-anchor="middle">Returned late</text>

  <!-- Issued -->
  <rect x="30" y="110" width="150" height="60" rx="14" fill="#1d4ed8" stroke="#60a5fa" stroke-width="2.5"/>
  <text x="105" y="145" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">📋 Issued</text>

  <!-- Borrowed -->
  <rect x="250" y="110" width="150" height="60" rx="14" fill="#0284c7" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="325" y="145" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">⏳ Borrowed</text>

  <!-- Returned (On Time) -->
  <rect x="490" y="40" width="160" height="60" rx="14" fill="#15803d" stroke="#4ade80" stroke-width="2.5"/>
  <text x="570" y="75" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">✅ Returned</text>

  <!-- Overdue -->
  <rect x="490" y="180" width="160" height="60" rx="14" fill="#b91c1c" stroke="#f87171" stroke-width="2.5"/>
  <text x="570" y="207" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">🚨 Overdue</text>
  <text x="570" y="225" fill="#fca5a5" font-size="10" text-anchor="middle">Past Expected Date</text>

  <!-- Returned (Late) -->
  <rect x="710" y="180" width="130" height="60" rx="14" fill="#15803d" stroke="#4ade80" stroke-width="2.5"/>
  <text x="775" y="215" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">✅ Returned</text>
</svg>