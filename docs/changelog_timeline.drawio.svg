<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 210" width="100%" height="100%" style="background-color: #0b0f19; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Top Level Headers -->
  <rect x="40" y="30" width="340" height="65" rx="12" fill="#065f46" stroke="#34d399" stroke-width="2" filter="url(#shadow)"/>
  <text x="210" y="58" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">🎉 v1.0.0 — Initial Production Release</text>
  <text x="210" y="78" fill="#a7f3d0" font-size="11" text-anchor="middle">Released: 2026-07-27 • Production Stable</text>

  <rect x="440" y="30" width="320" height="65" rx="12" fill="#0369a1" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="58" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">📜 Versioning Standards</text>
  <text x="600" y="78" fill="#bae6fd" font-size="11" text-anchor="middle">Keep a Changelog 1.1.0 • SemVer 2.0.0</text>

  <!-- Feature Cards -->
  <rect x="40" y="125" width="220" height="55" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="150" y="148" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">📊 Inventory &amp; Excel Import</text>
  <text x="150" y="165" fill="#cbd5e1" font-size="10" text-anchor="middle">Side-drawer UI &amp; SimpleDatatables</text>

  <rect x="280" y="125" width="220" height="55" rx="10" fill="#092E20" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="390" y="148" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">🔄 Borrowing Tracker &amp; Overdue</text>
  <text x="390" y="165" fill="#a7f3d0" font-size="10" text-anchor="middle">Issuance &amp; Quantity Restoration</text>

  <rect x="520" y="125" width="240" height="55" rx="10" fill="#581c87" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="148" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">📝 Audit Trail &amp; OTP Auth</text>
  <text x="640" y="165" fill="#ddd6fe" font-size="10" text-anchor="middle">State Diffs &amp; Sliding Auth Portal</text>
</svg>