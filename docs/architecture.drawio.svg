<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" style="background:#0f172a; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <!-- Connectors -->
  <path d="M 230 260 L 320 260" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>
  <text x="275" y="248" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Authenticates</text>

  <path d="M 540 260 L 650 260" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow-green)" fill="none"/>
  <text x="595" y="248" fill="#a7f3d0" font-size="11" font-weight="600" text-anchor="middle">CRUD Operations</text>

  <path d="M 750 210 L 750 160" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow-blue)" fill="none"/>
  <text x="795" y="190" fill="#bfdbfe" font-size="11" font-weight="600" text-anchor="start">Syncs Data</text>

  <path d="M 640 100 L 540 100" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow-blue)" fill="none"/>
  <text x="590" y="88" fill="#bfdbfe" font-size="11" font-weight="600" text-anchor="middle">Issue Equipment</text>

  <path d="M 430 135 L 430 200 L 700 200 L 700 210" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-sky)" fill="none"/>
  <text x="560" y="190" fill="#bae6fd" font-size="11" font-weight="600" text-anchor="middle">Restores Quantity</text>

  <path d="M 430 295 L 430 380" stroke="#f43f5e" stroke-width="2.5" marker-end="url(#arrow-rose)" fill="none"/>
  <text x="490" y="340" fill="#fecdd3" font-size="11" font-weight="600" text-anchor="start">All Actions Logged</text>

  <!-- Auth Portal -->
  <rect x="30" y="225" width="200" height="70" rx="14" fill="#1e293b" stroke="#475569" stroke-width="2.5"/>
  <text x="130" y="255" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">🔑 Auth Portal</text>
  <text x="130" y="275" fill="#94a3b8" font-size="11" text-anchor="middle">Login / Signup OTP / Reset OTP</text>

  <!-- ITS Staff -->
  <rect x="320" y="225" width="220" height="70" rx="14" fill="#092e20" stroke="#10b981" stroke-width="2.5"/>
  <text x="430" y="255" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">🧑‍💼 ITS Staff</text>
  <text x="430" y="275" fill="#a7f3d0" font-size="11" text-anchor="middle">Add / Edit / Delete / Import</text>

  <!-- DB -->
  <rect x="650" y="210" width="200" height="100" rx="20" fill="#003b57" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="750" y="253" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">🗄️ Inventory DB</text>
  <text x="750" y="275" fill="#bae6fd" font-size="11" text-anchor="middle">SQLite / PostgreSQL</text>

  <!-- Dashboard -->
  <polygon points="750,30 870,95 750,160 630,95" fill="#1d4ed8" stroke="#60a5fa" stroke-width="2.5"/>
  <text x="750" y="90" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">📊 Dashboard</text>
  <text x="750" y="108" fill="#bfdbfe" font-size="10" text-anchor="middle">Search / Filter / Sort</text>

  <!-- Borrowing -->
  <rect x="320" y="65" width="220" height="70" rx="14" fill="#0369a1" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="430" y="95" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">🔄 Borrowing Tracker</text>
  <text x="430" y="115" fill="#bae6fd" font-size="11" text-anchor="middle">Issue / Return / Overdue</text>

  <!-- Activity Log -->
  <rect x="320" y="380" width="220" height="70" rx="14" fill="#334155" stroke="#94a3b8" stroke-width="2.5"/>
  <text x="430" y="410" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">📝 Activity Log</text>
  <text x="430" y="430" fill="#cbd5e1" font-size="11" text-anchor="middle">Audit Trail + Diffs</text>
</svg>